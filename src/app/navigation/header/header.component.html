<div class="calc-header">
  <mat-toolbar class='mat-elevation-z4 bg-primary' color="primary">
    <mat-toolbar-row>
      <div class="calc-mobile-menu-toggle">
        <button mat-icon-button (click)="onToggleSidenav()">
          <mat-icon>menu</mat-icon>
        </button>
      </div>
      <a class='navbar-brand'>{{title}}</a>
      <span class="navbar-spacer"></span>
      <div class="calc-nav-links">
        <div class="calc-key-container" routerLink='/'>
          <div class="calc-key">
            <a class="mat-button calc-key-text" >Home</a>
          </div>
        </div>
        <div class="calc-key-container" routerLink='/about'>
          <div class="calc-key">
            <a class="mat-button calc-key-text" >About Me</a>
          </div>
        </div>
        <div class="calc-key-container" routerLink='/projects'>
          <div class="calc-key">
            <a class="mat-button calc-key-text" >Projects</a>
          </div>
        </div>
        <div class="calc-key-container" routerLink='/contact'>
          <div class="calc-key">
            <a class="mat-button calc-key-text" >Contact</a>
          </div>
        </div>
        <div class="calc-key-container" routerLink='/collection'>
          <div class="calc-key">
            <a class="mat-button calc-key-text" >Collection</a>
          </div>
        </div>
      </div>
    </mat-toolbar-row>
  </mat-toolbar>
</div>
